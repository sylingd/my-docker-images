name: build

on:
  workflow_dispatch:
    inputs:
      context:
        description: 'context'
        required: true
        type: string
      push-tag:
        description: 'Push Tag'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKERHUB_URL }}
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ${{ github.workspace }}/${{ github.event.inputs.context }}
          tags: ${{ vars.DOCKERHUB_URL }}/${{ github.event.inputs.push-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max